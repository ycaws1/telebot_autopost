{% extends "base.html" %}
{% block title %}Login — Telebot{% endblock %}
{% block content %}
<div class="auth-top">
  <a class="brand" href="/"><span class="brand-mark">T</span> Telebot</a>
</div>
<div class="auth-wrap">
  <section class="auth">
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to manage your Telegram posts</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Username <input name="username" required autocomplete="username" placeholder="Admin username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password" placeholder="••••••••"></label>
      <button type="submit">Sign in</button>
    </form>
    <p class="auth-foot">Single admin access.</p>
  </section>
</div>
{% endblock %}
