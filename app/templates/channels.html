{% extends "base.html" %}
{% block title %}Channels — Telebot{% endblock %}
{% block content %}
<h1>Channels</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/channels" class="stack">
  <label>Name <input name="name" required></label>
  <label>Chat ID <input name="chat_id" placeholder="@channel or -100..." required></label>
  <button type="submit">Add channel</button>
</form>
<table>
  <thead><tr><th>Name</th><th>Chat ID</th><th></th></tr></thead>
  <tbody>
  {% for c in channels %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.chat_id }}</td>
      <td>
        <form method="post" action="/channels/{{ c.id }}/delete" class="inline">
          <button type="submit">Delete</button>
        </form>
      </td>
    </tr>
  {% else %}
    <tr><td colspan="3">No channels yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
